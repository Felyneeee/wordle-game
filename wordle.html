<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <style>
        :root {
            --color-bg: #121213;
            --color-text: #ffffff;
            --color-border-empty: #3a3a3c;
            --color-border-active: #565758;
            --color-correct: #538d4e;
            --color-present: #b59f3b;
            --color-absent: #3a3a3c;
            --color-key-bg: #818384;
            --color-key-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            width: 100%;
            flex: 0 0 auto;
            height: clamp(40px, 8vh, 50px);
            border-bottom: 1px solid var(--color-border-empty);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 700;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        #toast-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            background-color: #ffffff;
            color: #000000;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 23px 0 rgba(0, 0, 0, 0.2);
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            aspect-ratio: 5 / 6;
            height: 100%;
            max-height: 100%;
            max-width: 100%;
            width: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
            transition: opacity 0.2s ease;
        }

        .row.completed {
            cursor: pointer;
        }

        .row.completed:hover {
            opacity: 0.85;
        }

        .dict-link {
            color: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--color-border-empty);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1rem, min(6vh, 9vw), 2.2rem);
            line-height: 1;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        .tile[data-state="active"] {
            border-color: var(--color-border-active);
            animation: pop 0.1s ease-in-out;
        }

        .tile.flip {
            animation: flipTile 0.5s ease forwards;
        }

        .tile[data-state="correct"] {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
        }

        .tile[data-state="present"] {
            background-color: var(--color-present);
            border-color: var(--color-present);
        }

        .tile[data-state="absent"] {
            background-color: var(--color-absent);
            border-color: var(--color-absent);
        }

        .row.shake {
            animation: shake 0.5s ease;
        }

        #keyboard {
            width: 100%;
            max-width: 500px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 1vh, 6px);
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .kbd-row {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: clamp(3px, 1vw, 6px);
        }

        .key {
            font-family: inherit;
            font-size: clamp(10px, 3vw, 13px);
            font-weight: bold;
            border: 0;
            padding: 0;
            height: clamp(38px, 7.5vh, 58px);
            min-width: 0;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: var(--color-key-bg);
            color: var(--color-key-text);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        .key.large {
            flex: 1.5;
            font-size: clamp(9px, 2.5vw, 11px);
        }

        .key[data-state="correct"] { background-color: var(--color-correct) !important; }
        .key[data-state="present"] { background-color: var(--color-present) !important; }
        .key[data-state="absent"] { background-color: var(--color-absent) !important; opacity: 0.4; }

        /* UNCLOSABLE RICKROLL OVERLAY */
        #rickroll-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
        }

        #rickroll-overlay h1 {
            color: #ff3333;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 10px;
        }

        #rickroll-img {
            width: 90%;
            max-width: 500px;
            height: auto;
            border: 4px solid red;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            border-radius: 8px;
        }

        .play-again-btn {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #538d4e;
            color: #ffffff;
            transition: opacity 0.2s ease;
        }

        .play-again-btn:hover {
            opacity: 0.85;
        }

        #win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(18, 18, 19, 0.96);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
            text-align: center;
            padding: 20px;
        }

        #win-overlay h1 {
            color: var(--color-correct);
            font-size: clamp(1.3rem, 6vw, 1.8rem);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #win-overlay p {
            margin-top: 8px;
            font-size: clamp(0.9rem, 4vw, 1rem);
            color: #d7dadc;
        }

        #video-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes flipTile {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
    </style>
</head>

            if (isGameOver || isProcessing) return; // block input mid-reveal
            const key = e.key.toUpperCase();
            if (key === "ENTER") handleKey("ENTER");
            else if (key === "BACKSPACE" || key === "DELETE") handleKey("BACKSPACE");
            else if (/^[A-Z]$/.test(key)) handleKey(key);
        });

        document.querySelectorAll(".key").forEach(button => {
            button.addEventListener("click", () => {
                if (isGameOver || isProcessing) return; // block input mid-reveal
                handleKey(button.getAttribute("data-key"));
            });
        });

        function handleKey(key) {
            if (key === "ENTER") submitGuess();
            else if (key === "BACKSPACE") removeLetter();
            else if (currentTile < 5) addLetter(key);
        }

        function addLetter(letter) {
            boardState[currentRow][currentTile] = letter;
            const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
            tile.textContent = letter;
            tile.setAttribute("data-state", "active");
            currentTile++;
        }

        function removeLetter() {
            if (currentTile > 0) {
                currentTile--;
                boardState[currentRow][currentTile] = "";
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.textContent = "";
                tile.removeAttribute("data-state");
            }
        }

        async function submitGuess() {
            if (isProcessing) return; // extra safety against double-submits

            if (currentTile < 5) {
                showToast("Not enough letters");
                shakeRow(currentRow);
                return;
            }

            const guess = boardState[currentRow].join("");

            if (!dictionary.has(guess)) {
                showToast("Not in word list");
                shakeRow(currentRow);
                return;
            }

            isProcessing = true; // lock as soon as we know this is a real, valid guess

            const targetArray = targetWord.split("");
            const guessArray = guess.split("");
            const rowJustSubmitted = currentRow;

            guessArray.forEach((letter, index) => {
                const tile = document.getElementById(`tile-${rowJustSubmitted}-${index}`);
                
                setTimeout(() => {
                    tile.classList.add("flip");

                    let state = "absent";
                    if (letter === targetArray[index]) state = "correct";
                    else if (targetArray.includes(letter)) state = "present";

                    tile.setAttribute("data-state", state);
                    updateKeyboard(letter, state);
                }, index * 250);
            });

            // Wait for the LAST tile's flip animation to fully finish before deciding anything
            setTimeout(() => {
                const rowEl = document.getElementById(`row-${rowJustSubmitted}`);
                if (rowEl) {
                    rowEl.classList.add("completed");
                    rowEl.title = "Click to view definition online";
                    rowEl.onclick = () => openOnlineDictionary(guess);
                }

                if (guess === targetWord) {
                    isGameOver = true;
                    isProcessing = true; // keep locked, game is over
                    triggerWin();
                } else {
                    currentRow++;
                    currentTile = 0;

                    if (currentRow === 6) {
                        // Only now, after the 6th (last) guess has fully revealed, trigger game over
                        isGameOver = true;
                        triggerUnclosableRickroll();
                    } else {
                        isProcessing = false; // unlock for the next guess
                    }
                }
            }, 5 * 250 + 500); // 500ms = full flip animation duration, so it waits for the LAST tile to finish
        }

        function openOnlineDictionary(word) {
            window.open(`https://www.merriam-webster.com/dictionary/${word.toLowerCase()}`, "_blank");
        }

        function triggerWin() {
            const guessesUsed = currentRow + 1;
            winText.innerHTML = `You got it in ${guessesUsed} ${guessesUsed === 1 ? "guess" : "guesses"}! The word was <a class="dict-link" href="https://www.merriam-webster.com/dictionary/${targetWord.toLowerCase()}" target="_blank">${targetWord}</a>.`;
            winOverlay.style.display = "flex";
        }

        function triggerUnclosableRickroll() {
            gameOverText.innerHTML = `YOU LOST! THE WORD WAS: <a class="dict-link" href="https://www.merriam-webster.com/dictionary/${targetWord.toLowerCase()}" target="_blank" style="color: #ff3333;">${targetWord}</a>`;
            
            // 1. Play direct HTML5 MP3 Audio (Allowed because user pressed ENTER key)
            rickrollAudio.currentTime = 0;
            rickrollAudio.play().catch(e => console.log("Audio play error:", e));
            
            // 3. Display unclosable overlay
            overlay.style.display = "flex";
        }

        function resetGame() {
            // Reset state
            currentRow = 0;
            currentTile = 0;
            isGameOver = false;
            isProcessing = false;
            for (let r = 0; r < 6; r++) {
                const rowEl = document.getElementById(`row-${r}`);
                if (rowEl) {
                    rowEl.classList.remove("completed");
                    rowEl.removeAttribute("title");
                    rowEl.onclick = null;
                }
                for (let c = 0; c < 5; c++) {
                    boardState[r][c] = "";
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    tile.textContent = "";
                    tile.removeAttribute("data-state");
                    tile.classList.remove("flip");
                }
            }

            // Reset keyboard colors
            document.querySelectorAll(".key").forEach(key => key.removeAttribute("data-state"));

            // Hide overlays and stop rickroll audio
            overlay.style.display = "none";
            winOverlay.style.display = "none";
            rickrollAudio.pause();
            rickrollAudio.currentTime = 0;

            // Pick a fresh target word
            targetWord = TARGET_WORDS[Math.floor(Math.random() * TARGET_WORDS.length)];
        }

        playAgainLoseBtn.addEventListener("click", resetGame);
        playAgainWinBtn.addEventListener("click", resetGame);

        function updateKeyboard(letter, state) {
            const keyButton = document.querySelector(`.key[data-key="${letter}"]`);
            if (!keyButton) return;

            const currentState = keyButton.getAttribute("data-state");
            if (currentState === "correct") return;
            if (currentState === "present" && state === "absent") return;

            keyButton.setAttribute("data-state", state);
        }

        function shakeRow(rowIndex) {
            const row = document.getElementById(`row-${rowIndex}`);
            row.classList.add("shake");
            setTimeout(() => row.classList.remove("shake"), 500);
        }

        function showToast(message, duration = 2000) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        initBoard();
    </script>
</body>
</html>
